<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
  
  <script type="module" src="./js/event.js"></script>
  <title>イベント情報入力</title>
</head>
<body>
    <div class="container">
        <h1>イベント情報入力</h1>

        <div class="event-schedule">
            <p>日程調整</p>            
            <h4>開始時間</h4>
                <input type="tel" id="startTime" maxlength="5" placeholder="例: 15:00">
            <h4>終了時間</h4>
                <input type="tel" id="endTime" maxlength="5" placeholder="例: 16:00">
            <h4>日付</h4>
                <input type="text" id="date" placeholder="日付を選択" />
            <h4>スケジュール</h4>
                <textarea type="text" id="schedule" rows="5" placeholder="例: 4/13(月) 19:00〜23:00"></textarea>
        </div>

        <div class="event-name">
            <h4>イベント名</h4>
            <input type="text" id="eventName" placeholder="イベント名を入力" inputmode="text" lang="ja">
        </div>

        <button id="saveButton" class="btn-primary">イベントを作る</button>
    </div>  
</body>
</html>
