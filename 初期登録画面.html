<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初回プロフィール登録 - FC TAKAMATSU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0f172a;
        }
        .pos-btn.active {
            border-color: #10b981;
            background-color: #ecfdf5;
            color: #065f46;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .pos-btn.active .pos-icon {
            color: #10b981;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">
    <!-- モバイル実機風コンテナ -->
    <div class="w-full max-w-md bg-slate-50 min-h-screen sm:min-h-[844px] sm:rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative border-0 sm:border-[8px] border-slate-800">

        <!-- ヘッダー -->
        <header class="bg-slate-900 text-white pt-10 pb-5 px-5 sticky top-0 z-20 shadow-md">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center font-bold text-white text-base shadow-inner">
                    FC
                </div>
                <div>
                    <h1 class="text-xs text-slate-400 font-medium">FC TAKAMATSU 出欠管理システム</h1>
                    <p class="text-base font-bold text-slate-100">メンバー初回プロフ登録</p>
                </div>
            </div>
        </header>

        <!-- メインコンテンツ領域 -->
        <main class="flex-1 p-5 overflow-y-auto pb-24 space-y-5">

            <!-- LINE連携連携完了通知バナー -->
            <div class="bg-emerald-50 border border-emerald-200/80 rounded-2xl p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xl shadow-md">
                        <i class="fa-brands fa-line"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span class="text-xs font-bold text-emerald-800">LINEアカウント連携済み</span>
                            <i class="fa-solid fa-circle-check text-emerald-600 text-xs"></i>
                        </div>
                        <p class="text-xs text-slate-600 font-medium mt-0.5">高松 太郎（@taro_soccer）</p>
                    </div>
                </div>
                <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-1 rounded-md font-bold">認証OK</span>
            </div>

            <!-- ガイドメッセージ -->
            <div>
                <h2 class="text-lg font-bold text-slate-800 leading-snug">
                    チーム内での表示名を<br>設定してください
                </h2>
                <p class="text-xs text-slate-500 mt-1">
                    背番号や公式ポジションなどの選手データは管理者によって登録・管理されます。
                </p>
            </div>

            <!-- 登録フォームカード -->
            <form id="profile-form" onsubmit="handleRegister(event)" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-5">
                
                <!-- チーム表示名 -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">
                        チーム内表示名 <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user text-sm"></i>
                        </span>
                        <input type="text" id="display-name" required value="高松 太郎" 
                            placeholder="例: 高松 太郎（またはニックネーム）" 
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent bg-slate-50/50 font-medium text-slate-800">
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1">※出欠一覧や連絡通知時に表示される名前です</p>
                </div>

                <!-- 管理者紐付け情報の案内カード -->
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-600 flex items-start gap-2.5">
                    <i class="fa-solid fa-id-card text-emerald-600 text-sm mt-0.5"></i>
                    <div>
                        <div class="font-bold text-slate-700 mb-0.5">選手データとの紐付けについて</div>
                        <p class="text-[11px] text-slate-500 leading-relaxed mb-0">
                            登録完了後、管理者が管理マスタの選手情報（背番号・登録ポジション等）とアカウントを紐付けます。
                        </p>
                    </div>
                </div>

                <!-- 同意のチェック -->
                <div class="pt-1">
                    <label class="flex items-start gap-2 cursor-pointer">
                        <input type="checkbox" required checked class="mt-0.5 rounded text-emerald-600 focus:ring-0">
                        <span class="text-xs text-slate-600 leading-tight">
                            チーム出欠管理システムの利用規約およびメンバー情報共有に同意します
                        </span>
                    </label>
                </div>

                <!-- 登録ボタン -->
                <!--
                <button type="submit" 
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 text-sm mt-2">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>登録して出欠回答へ進む</span>
                </button>
                -->
                <!-- 登録ボタン（aタグに変更して href を指定） -->
				<a href="入力画面.html" 
				   class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 text-sm mt-2 text-center">
				    <i class="fa-solid fa-user-plus"></i>
				    <span>登録して出欠回答へ進む</span>
				</a>
            </form>

        </main>

        <!-- 完了案内トースト / モーダル -->
        <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl space-y-4">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div>
                    <h4 class="text-lg font-bold text-slate-800">登録が完了しました！</h4>
                    <p class="text-xs text-slate-500 mt-1">次回以降はLINEからアクセスするだけで自動で認識されます。</p>
                </div>
                <button onclick="goToAttendancePage()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow-md transition-all">
                    試合の出欠入力画面へ進む
                </button>
            </div>
        </div>

    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            const displayName = document.getElementById('display-name').value;
            
            if (!displayName.trim()) {
                showToastMessage('表示名を入力してください');
                return;
            }

            // 完了モーダルの表示
            document.getElementById('modal').classList.remove('hidden');
        }

        function goToAttendancePage() {
            // トーストの削除・遷移演出イメージ
            document.getElementById('modal').classList.add('hidden');
            showToastMessage('画面②（出欠入力）に遷移します');
        }

        function showToastMessage(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg z-50 animate-bounce';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
    </script>
</body>
</html>
